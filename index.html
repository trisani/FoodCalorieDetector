<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Food Calorie Detector</title>
<style>
/* 🌈 Vibrant Gradient Background */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #ff9a8b, #ff6a88, #ff99ac);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: #fff;
}

.container {
  background: rgba(255, 255, 255, 0.15);
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
  text-align: center;
  width: 350px;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-size: 24px;
  margin-bottom: 10px;
  font-weight: 700;
}

input, button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin: 8px 0;
  font-size: 14px;
}

input[type="file"] {
  background: #fff;
  color: #333;
  cursor: pointer;
}

button {
  background: #ff006e;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s;
}
button:hover {
  transform: scale(1.05);
  background: #fb5607;
}

#imagePreview img {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
  box-shadow: 0 0 15px rgba(255,255,255,0.6);
}

#loading {
  display: none;
  font-size: 18px;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 0.5; }
  50% { opacity: 1; }
  100% { opacity: 0.5; }
}

#result {
  display: none;
  background: #fff;
  padding: 14px;
  color: #222;
  border-radius: 10px;
  margin-top: 10px;
  animation: pop 0.5s ease;
}
@keyframes pop {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="container">
  <h1>🍽️ Food Calorie Detector</h1>

  <input type="file" id="imageInput" accept="image/*" />
  <div id="imagePreview"><p>No image selected</p></div>

  <button id="analyzeBtn">Analyze 🍰</button>
  <div id="loading">⏳ Analyzing food...</div>

  <div id="result">🍕 <b id="foodName"></b><br>🔥 Calories: <b id="calories"></b> kcal</div>
</div>

<script>
const imageInput = document.getElementById('imageInput');
const imagePreview = document.getElementById('imagePreview');
const analyzeBtn = document.getElementById('analyzeBtn');
const foodName = document.getElementById('foodName');
const calories = document.getElementById('calories');
const loading = document.getElementById('loading');
const result = document.getElementById('result');

let selectedImage = null;

imageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      imagePreview.innerHTML = `<img src="${ev.target.result}" />`;
    };
    reader.readAsDataURL(file);
    selectedImage = file;
  } else {
    imagePreview.innerHTML = `<p>No image selected</p>`;
    selectedImage = null;
  }
});

analyzeBtn.addEventListener('click', () => {
  if (!selectedImage) return alert("Upload an image first!");

  result.style.display = "none";
  loading.style.display = "block";

  setTimeout(() => {
    const foods = [
      { name: "Burger", cal: 540 },
      { name: "Pizza Slice", cal: 285 },
      { name: "Chocolate Cake", cal: 350 },
      { name: "Biryani", cal: 420 },
      { name: "Samosa", cal: 262 }
    ];
    const random = foods[Math.floor(Math.random() * foods.length)];

    loading.style.display = "none";
    result.style.display = "block";

    foodName.textContent = random.name;
    calories.textContent = random.cal;
  }, 1500);
});
</script>
</body>
</html>
